buildscript {
	repositories {
		maven { url = 'https://maven.fabricmc.net/' }
		mavenCentral()
		gradlePluginPortal()
	}
	dependencies {
		classpath 'net.fabricmc:fabric-loom:1.3.10'
	}
}

plugins {
	id 'maven-publish'
}

apply plugin: 'fabric-loom'

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Dev-server console libraries live in Maven Central. Keeping this group
	// exclusive avoids long Fabric mirror timeouts during runServer.
	exclusiveContent {
		forRepository {
			mavenCentral()
		}
		filter {
			includeGroup 'org.jline'
		}
	}
}

loom {
    runs {
        client {
            client()
            name "Minecraft Client"
            runDir "run"

            programArg "--username"
            programArg "Zunserz"
        }

        server {
            server()
            name "Minecraft Server"
            runDir "run_server"
        }

		datagen {
			inherit server
			name "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
			vmArg "-Dfabric-api.datagen.modid=imba"

			runDir "build/datagen"
		}
	}
}

sourceSets {
	main {
		resources {
			srcDirs += [
					'src/main/generated'
			]
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	if (file("LICENSE").exists()) {
		from("LICENSE") {
			rename { "${it}_${project.base.archivesName.get()}"}
		}
	}
}

def imbaModDirectories = [
		'C:/Users/honor/AppData/Roaming/ModrinthApp/profiles/Имба прятки/mods',
		'C:/Users/honor/AppData/Roaming/ModrinthApp/profiles/Имба прятки (1)/mods'
]

tasks.register('installImbaMod') {
	dependsOn tasks.named('remapJar')
	group = 'build'
	description = 'Копирует собранный IMBA JAR в настроенные профили Modrinth.'

	doLast {
		File builtJar = tasks.named('remapJar').get().archiveFile.get().asFile
		imbaModDirectories.each { configuredPath ->
			// File avoids Gradle treating the Cyrillic Windows path as an URI on non-Windows builders.
			File modsDirectory = new File(configuredPath)
			if (!modsDirectory.isDirectory()) {
				logger.lifecycle("IMBA: папка профиля не найдена, пропуск: ${modsDirectory}")
				return
			}

			fileTree(modsDirectory) {
				include 'IMBA-*.jar'
				include 'testing-mod-*.jar'
			}.files.each { oldJar ->
				if (oldJar.name != builtJar.name && !oldJar.delete()) {
					throw new GradleException("Не удалось заменить старый мод: ${oldJar}")
				}
			}

			copy {
				from builtJar
				into modsDirectory
			}
			logger.lifecycle("IMBA: установлен в ${modsDirectory}")
		}
	}
}

tasks.named('build') {
	finalizedBy tasks.named('installImbaMod')
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
