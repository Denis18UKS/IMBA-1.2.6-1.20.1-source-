name: Apply gameplay patch

on:
  push:
    branches:
      - fix/gameplay-document-revisions
    paths:
      - .github/patches/gameplay-fixes.patch.gz.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/gameplay-document-revisions
          fetch-depth: 0

      - name: Apply prepared patch
        shell: bash
        run: |
          base64 --decode .github/patches/gameplay-fixes.patch.gz.b64 | gzip --decompress > /tmp/gameplay-fixes.patch
          git apply --index /tmp/gameplay-fixes.patch
          git rm .github/patches/gameplay-fixes.patch.gz.b64
          git rm .github/workflows/apply-gameplay-patch.yml

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: implement gameplay and document revisions"
          git push origin HEAD:fix/gameplay-document-revisions
