name: Build gameplay fixes

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v4
        with:
          ref: fix/gameplay-document-revisions
          fetch-depth: 0

      - name: Apply gameplay patch when present
        shell: bash
        run: |
          if [ -f .github/patches/gameplay-fixes.patch.gz.b64 ]; then
            base64 --decode .github/patches/gameplay-fixes.patch.gz.b64 | gzip --decompress > /tmp/gameplay-fixes.patch
            git apply --index /tmp/gameplay-fixes.patch
            git rm .github/patches/gameplay-fixes.patch.gz.b64
            if [ -f .github/workflows/apply-gameplay-patch.yml ]; then
              git rm .github/workflows/apply-gameplay-patch.yml
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: implement gameplay and document revisions"
            git push origin HEAD:fix/gameplay-document-revisions
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Prepare source archive
        run: |
          mkdir -p artifacts
          zip -r artifacts/IMBA-1.2.6-1.20.1-fixed-sources.zip . \
            -x '.git/*' '.gradle/*' 'build/*' 'run/*' 'artifacts/*'

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: imba-fixed-sources
          path: artifacts/IMBA-1.2.6-1.20.1-fixed-sources.zip
          if-no-files-found: error

      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: imba-built-jar
          path: build/libs/*.jar
          if-no-files-found: error
